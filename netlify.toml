[build]
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# ---------- REDIRECTS ----------

[[redirects]]
  from = "https://coco-color-lab.cultureschool.org/*"
  to   = "/color-lab"
  status = 200

[[redirects]]
  from = "https://coco-color-lab.cultureschool.org"
  to   = "/color-lab"
  status = 200

[[redirects]]
  from = "/api/anthropic"
  to   = "/.netlify/functions/anthropic-proxy"
  status = 200

[[redirects]]
  from = "/api/anthropic-proxy"
  to   = "/.netlify/functions/anthropic-proxy"
  status = 200

[[redirects]]
  from = "/api/unsplash-proxy"
  to   = "/.netlify/functions/unsplash-proxy"
  status = 200

[[redirects]]
  from = "/api/pixabay-proxy"
  to   = "/.netlify/functions/pixabay-proxy"
  status = 200

[[redirects]]
  from = "/api/pexels-proxy"
  to   = "/.netlify/functions/pexels-proxy"
  status = 200

[[redirects]]
  from = "/b/:slug"
  to   = "/pages/seaport-viewer?slug=:slug"
  status = 200

[[redirects]]
  from = "/board/:id"
  to   = "/pages/seaport-viewer?board=:id"
  status = 200

# ---------- CACHING ----------

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# ---------- SECURITY ----------

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' https: 'unsafe-inline'; style-src 'self' https: 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://cultureschool-backend.onrender.com https:; media-src 'self' https://cultureschool-backend.onrender.com blob:; frame-ancestors 'self' https://www.cultureschool.org https://cultureschool.org;"
    Permissions-Policy = "autoplay=*, microphone=*"

# ---------- ADMIN LOCKDOWN ----------

[[headers]]
  for = "/admin/*"
  [headers.values]
    Basic-Auth = "coco:letmein"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/coco-admin/*"
  [headers.values]
    Basic-Auth = "coco:letmein"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/event-collector/*"
  [headers.values]
    Basic-Auth = "coco:letmein"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/coco-admin-editor/*"
  [headers.values]
    Basic-Auth = "coco:letmein"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/health/*"
  [headers.values]
    Cache-Control = "no-store"
