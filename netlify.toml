[build]
  publish   = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/pexels-proxy"
  to   = "/.netlify/functions/pexels-proxy"
  status = 200

[[redirects]]
  from = "/api/pixabay-proxy"
  to   = "/.netlify/functions/pixabay-proxy"
  status = 200
  
/b/:slug   /pages/seaport-viewer?slug=:slug   200
/board/:id /pages/seaport-viewer?board=:id    200
[build]
  publish = "dist"

[[headers]]
  for = "/*.js"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
  Cache-Control = "public, max-age=300" # HTML kept short
/*
  Content-Security-Policy: frame-ancestors 'self' https://www.cultureschool.org https://cultureschool.org;
  X-Frame-Options: ALLOW-FROM https://www.cultureschool.org

