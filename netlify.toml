# ---------- CACHING ----------
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/images*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# ---------- SECURITY + VOICE (CRITICAL) ----------
[[headers]]
  for = "/*"
  [headers.values]
    # Allow embedding
    Content-Security-Policy = """
      default-src 'self' https:;
      script-src 'self' https: 'unsafe-inline';
      style-src 'self' https: 'unsafe-inline';
      img-src 'self' https: data:;
      connect-src 'self' https://cultureschool-backend.onrender.com https:;
      media-src 'self' https://cultureschool-backend.onrender.com blob:;
      frame-ancestors 'self' https://www.cultureschool.org https://cultureschool.org;
    """
    Permissions-Policy = "autoplay=*, microphone=*"

# ---------- ADMIN LOCKDOWN ----------
[[headers]]
  for = "/admin/*"
  [headers.values]
    Basic-Auth = "coco:letmein"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/coco-admin/*"
  [headers.values]
    Basic-Auth = "coco:letmein"
    X

