<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  
 <!-- Dynamic OG Meta (populated via JS if needed) -->
<title id="pageTitle">Creator Bundle: Holiday Pop-Up Templates — CoCoCreate</title>
<meta property="og:type" content="product">
<meta property="og:site_name" content="CoCoCreate by CultureSchool">
<meta property="og:title" content="Creator Bundle: Holiday Pop-Up Templates — 2 Pack">
<meta property="og:description" content="Two festive pop-up templates to launch your seasonal microstore in minutes. Designed for creators, makers, and small brands — powered by CoCoCreate.">
<meta property="og:image" content="https://cdn.shopify.com/s/files/1/0673/3637/2387/files/An_ad_for_CoCoreate_Holiday_Bundle.png?v=1762801743">
<meta property="og:url" content="https://cultureschool.netlify.app/board.html?bundle=holiday-shoppe">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Creator Bundle: Holiday Pop-Up Templates — CoCoCreate">
<meta name="twitter:description" content="Build your seasonal pop-up with CoCoCreate — festive templates, no design skills required.">
<meta name="twitter:image" content="https://cdn.shopify.com/s/files/1/0673/3637/2387/files/An_ad_for_CoCoreate_Holiday_Bundle.png?v=1762801743">

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f4efe9;
      color: #181514;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 48px 24px 16px;
      background: linear-gradient(135deg,#b47cff,#fa8b65);
      color: white;
    }
    header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin: 0; }
    header p { font-size: 1.1rem; margin-top: 8px; opacity: 0.95; }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
    }
    img.banner {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .creator { font-size: 0.9rem; opacity: 0.8; }
    .cta {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg,#b47cff,#fa8b65);
      color: white;
      font-weight: 600;
      border-radius: 30px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .cta:hover { transform: translateY(-2px); }
  </style>

  <script type="module">
    // ---- CONFIG ----
    const SUPABASE_URL = 'https://qwulthvbwujfehgdegtn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3dWx0aHZid3VqZmVoZ2RlZ3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQyMDcxODIsImV4cCI6MjA1OTc4MzE4Mn0.t9n4eZng6d0jggiPNK-J_DByvEE2L9tqy5Xh_1-TSoQ';
    const VIEWER_BASE = 'https://viewer-cocospark.netlify.app';

    // ---- UTIL ----
    const qp = new URLSearchParams(location.search);
    const slugOrId = qp.get('board');

    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadBoard(){
      if(!slugOrId){ return renderError('Missing ?board param'); }
      let { data, error } = await sb
        .from('cocoboards')
        .select('id,slug,title,description,banner_url,creator_email')
        .or(`id.eq.${slugOrId},slug.eq.${slugOrId}`)
        .single();
      if(error || !data){ renderError('Board not found'); return; }
      render(data);
    }

    function render(b){
      // Update OG tags dynamically
      document.title = `${b.title || 'CoCo Pop-Up'} | CoCoCreate`;
      setMeta('og:title', b.title);
      setMeta('og:description', b.description || 'See this pop-up made with CoCoCreate');
      setMeta('og:image', b.banner_url || 'https://cdn.shopify.com/s/files/1/0673/3637/2387/files/CoCo_Creator_group.png?v=1761702500');
      setMeta('og:url', `${location.origin}${location.pathname}?board=${encodeURIComponent(b.slug || b.id)}`);
      setMeta('twitter:title', b.title);
      setMeta('twitter:description', b.description || '');
      setMeta('twitter:image', b.banner_url || 'https://cdn.shopify.com/s/files/1/0673/3637/2387/files/CoCo_Creator_group.png?v=1761702500');

      // Populate body
      document.body.innerHTML = `
        <header>
          <h1>${b.title || 'Untitled Pop-Up'}</h1>
          <p>${b.description || ''}</p>
        </header>
        <main>
          ${b.banner_url ? `<img src="${b.banner_url}" alt="" class="banner">` : ''}
          <p class="creator">✨ Created by ${b.creator_email || 'a CoCo Creator'}</p>
          <div style="text-align:center;margin-top:24px;">
            <a href="${VIEWER_BASE}/?board=${encodeURIComponent(b.slug || b.id)}" class="cta" target="_blank" rel="noopener">
              View Pop-Up →
            </a>
          </div>
        </main>`;
    }

    function renderError(msg){
      document.body.innerHTML = `<div style="padding:3rem;text-align:center;color:#a55">⚠️ ${msg}</div>`;
    }

    function setMeta(property, content){
      const el = document.querySelector(`meta[property="${property}"],meta[name="${property}"]`);
      if(el) el.setAttribute('content', content);
      else{
        const m = document.createElement('meta');
        if(property.startsWith('og:') || property.startsWith('twitter:')) m.setAttribute('property', property);
        else m.setAttribute('name', property);
        m.setAttribute('content', content);
        document.head.appendChild(m);
      }
    }

    loadBoard();
  </script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const bundle = params.get('bundle');
      const metaMap = {
        'holiday-shoppe': {
          title: "Creator Bundle: Holiday Pop-Up Templates — 2 Pack",
          desc: "Two festive pop-up templates to launch your seasonal microstore in minutes. Designed for creators, makers, and small brands — powered by CoCoCreate.",
          img: "https://cdn.shopify.com/s/files/1/0673/3637/2387/files/An_ad_for_CoCoreate_Holiday_Bundle.png?v=1762801743"
        },
        'social-skin-pack': {
          title: "Social Skin Pack — Ready-to-Post Templates",
          desc: "Instant, brand-ready social templates to make your posts shine.",
          img: "https://cdn.shopify.com/s/files/1/0673/3637/2387/files/Social_Skin_Pack.png?v=1762802166"
        }
      };
      const meta = metaMap[bundle];
      if (!meta) return;
    
      document.title = `${meta.title} | CoCoCreate`;
      const set = (p, c) => {
        let m = document.querySelector(`meta[property="${p}"]`);
        if (!m){ m = document.createElement('meta'); m.setAttribute('property', p); document.head.appendChild(m); }
        m.setAttribute('content', c);
      };
      set('og:title', meta.title);
      set('og:description', meta.desc);
      set('og:image', meta.img);
      set('og:url', location.href);
    })();
    </script>
    
</head>
<body>
</body>
</html>
