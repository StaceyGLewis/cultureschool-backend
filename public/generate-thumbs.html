   LOG
═══════════════════════════════════════════════ */
function log(msg, cls = 'log-info') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setProgress(done, total) {
  const pct = total ? (done / total * 100).toFixed(1) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent =
    `Generated ${done.toLocaleString()} / ${total.toLocaleString()} thumbnails (${pct}%)`;
}

/* ═══════════════════════════════════════════════
   FETCH ALL PATTERNS WITH NULL thumb_url
═══════════════════════════════════════════════ */
async function fetchAllPatterns() {
  log('Fetching patterns with missing thumbnails…');
  const all = [];
  let from = 0;
  while (true) {
    const { data, error } = await sb
      .from('patterns')
      .select('id, name, style, colors')
      .is('thumb_url', null)
      .range(from, from + BATCH_SIZE - 1);
    if (error) { log('Fetch error: ' + error.message, 'log-err'); break; }
    if (!data || !data.length) break;
    all.push(...data);
    log(`  Fetched batch ${Math.floor(from/BATCH_SIZE)+1}: ${data.length} patterns`);
    if (data.length < BATCH_SIZE) break;
    from += BATCH_SIZE;
  }
  return all;
}

/* ═══════════════════════════════════════════════
   ENSURE BUCKET EXISTS
═══════════════════════════════════════════════ */
async function ensureBucket() {
  // anon key cannot list or create buckets — assume it exists (create manually in Supabase dashboard)
  log(`Using bucket '${BUCKET}' — verifying with a test upload…`);
  const testBlob = new Blob(['ping'], { type: 'text/plain' });
  const { error } = await sb.storage.from(BUCKET).upload('_ping.txt', testBlob, { upsert: true });
  if (error) {
    log(`Bucket error: ${error.message}`, 'log-err');
    log(`Make sure the '${BUCKET}' bucket exists in Supabase Storage with public access and an upload policy.`, 'log-err');
    return false;
  }
  await sb.storage.from(BUCKET).remove(['_ping.txt']);
  log(`Bucket '${BUCKET}' ready ✓`);
  return true;
}

/* ═══════════════════════════════════════════════
   PROCESS ONE PATTERN
═══════════════════════════════════════════════ */
/* Styles whose output depends on user input that does not exist on a DB row.
   art-print reads window._artPrintImage; with none it renders the literal
   text "Upload your artwork →". Writing that to thumb_url would be worse
   than leaving it null, so these rows are skipped and reported. */
const UNTHUMBNAILABLE = new Set(['art-print']);

async function processPattern(p, idx, total) {
  const colors = parseColors(p.colors);
  const style  = (p.style || 'diamond').toLowerCase().trim();

  if (UNTHUMBNAILABLE.has(style)) {
    log(`[${idx+1}/${total}] ⊘ Skipped ${p.id} (${style}) — needs user artwork, no generic thumbnail possible`, 'log-warn');
    return false;
  }

  // Render
  let canvas;
  try {
    canvas = renderThumb(style, colors);
  } catch (e) {
    log(`[${idx+1}/${total}] ✗ Render failed for ${p.id} (${style}): ${e.message}`, 'log-err');
    return false;
  }

  // Export
  const blob = await canvasToBlob(canvas);
  if (!blob) {
    log(`[${idx+1}/${total}] ✗ Export failed for ${p.id}`, 'log-err');
    return false;
  }

  // Upload
  const path = `${p.id}.png`;
  const { error: upErr } = await sb.storage
    .from(BUCKET)
    .upload(path, blob, { contentType: 'image/png', upsert: true });
  if (upErr) {
    log(`[${idx+1}/${total}] ✗ Upload failed for ${p.id}: ${upErr.message}`, 'log-err');
    return false;
  }

  // Get public URL
  const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
  const publicUrl = urlData?.publicUrl;
  if (!publicUrl) {
    log(`[${idx+1}/${total}] ✗ Could not get URL for ${p.id}`, 'log-err');
    return false;
  }

  /* Update DB.
     `.select('id')` is load-bearing, not decoration. When RLS filters the row
     out — expired session, an account that doesn't pass cs_has_all_access(),
     the wrong login — PostgREST returns 204 with NO error and NO rows. The
     old code checked only `dbErr`, so every write silently no-opped while the
     log printed ✓ for all 6,451 patterns. That is exactly how the bucket
     ended up full and `patterns.thumb_url` ended up null on every row.
     Asking for the row back turns that silence into a hard failure. */
  const { data: updated, error: dbErr } = await sb
    .from('patterns')
    .update({ thumb_url: publicUrl })
    .eq('id', p.id)
    .select('id');
  if (dbErr) {
    log(`[${idx+1}/${total}] ✗ DB update failed for ${p.id}: ${dbErr.message}`, 'log-err');
    return false;
  }
  if (!updated || updated.length === 0) {
    log(`[${idx+1}/${total}] ✗ RLS blocked the thumb_url write for ${p.id} — ` +
        `the image uploaded but the database was NOT updated. Stopping: ` +
        `re-check you are signed in as an admin before continuing.`, 'log-err');
    _stopRequested = true;   // fail loudly on the first row, not the 6,451st
    return false;
  }

  log(`[${idx+1}/${total}] ✓ ${p.name || p.id} (${style})`, 'log-ok');
  addPreview(canvas);
  return true;
}

/* ═══════════════════════════════════════════════

async function startGeneration() {
  if (_running) return;
  _running = true;
  _stopRequested = false;

  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').style.display = 'inline-block';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('log').innerHTML = '';
  document.getElementById('statusChip').textContent = 'Running…';

  // Ensure bucket
  const bucketOk = await ensureBucket();
  if (!bucketOk) {
    finish(0, 0, 0);
    return;
  }

  // Fetch patterns
  const patterns = await fetchAllPatterns();
  const total = patterns.length;

  if (!total) {
    log('No patterns with missing thumbnails found. All done!', 'log-ok');
    finish(0, 0, 0);
    return;
  }

  log(`Found ${total} patterns to process. Starting…`);
  setProgress(0, total);

  let succeeded = 0, failed = 0;

  for (let i = 0; i < total; i++) {
    if (_stopRequested) {
      log('Stopped by user.', 'log-info');
      break;
    }
    const ok = await processPattern(patterns[i], i, total);
    if (ok) succeeded++; else failed++;
    setProgress(i + 1, total);
    await new Promise(r => setTimeout(r, DELAY_MS));
  }

  finish(succeeded, failed, total);
}

function stopGeneration() {
  _stopRequested = true;
  document.getElementById('statusChip').textContent = 'Stopping…';
}

function finish(succeeded, failed, total) {
  _running = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('statusChip').textContent = 'Done';

  if (total > 0) {
    document.getElementById('summary').style.display = 'block';
    document.getElementById('summary').innerHTML = `
      <strong>Generation complete</strong><br>
      ✓ ${succeeded.toLocaleString()} thumbnails generated and saved<br>
      ${failed ? `✗ ${failed.toLocaleString()} failed (see log above)` : '0 errors'}
      ${_stopRequested ? '<br>⚠ Run was stopped before completion — re-run to finish.' : ''}
    `;
  }
}
</script>
