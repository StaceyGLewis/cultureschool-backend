<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Print Studio for Schools · CultureSchool</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PRINT STUDIO FOR SCHOOLS — prototype
   Separate entry point sharing the pattern archive (school-mode
   brief §32: mode isolation, not a toggle inside the consumer app).
   Touches no consumer code path.

   PROTOTYPE STORAGE: everything persists to localStorage via the
   Store object below. Swapping to Supabase means replacing that one
   object — the SQL is in docs/school-mode.sql, unrun.

   ZERO STUDENT PII by construction. A student session is
   class code + display name + a random device token. No email,
   no password, no account, nothing that identifies a child.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --cream:#faf6ef; --paper:#fffdf9; --ink:#1a1208; --body:#4a3c28;
  --muted:#8a7a62; --faint:#b3a68f;
  --gold:#a9803c; --gold-lift:#c9a96e; --gold-wash:rgba(169,128,60,.09);
  --rule:#e6dfcf; --rule-soft:#f0eade;
  --live:#4a7c59; --live-wash:rgba(74,124,89,.1);
  --wait:#9a8156; --draft-wash:rgba(154,129,86,.12);
  --r:10px; --r-lg:16px;
  --shadow:0 1px 2px rgba(26,18,8,.04),0 8px 24px rgba(26,18,8,.06);
  --shadow-lg:0 2px 6px rgba(26,18,8,.06),0 20px 50px rgba(26,18,8,.12);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);
  font:400 16px/1.6 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
  margin:0;line-height:1.12;text-wrap:balance}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* ── shell ─────────────────────────────────────────────── */
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.topbar{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.mark{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.32rem;font-weight:600;letter-spacing:-.01em}
.mark small{display:block;font:500 .56rem/1 'DM Sans',sans-serif;letter-spacing:.26em;
  text-transform:uppercase;color:var(--gold);margin-top:3px}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:.82rem;color:var(--muted)}

/* ── type ──────────────────────────────────────────────── */
.eyebrow{font:500 .6rem/1 'DM Sans',sans-serif;letter-spacing:.26em;
  text-transform:uppercase;color:var(--gold)}
.lede{font-size:1.02rem;line-height:1.7;color:var(--body);max-width:62ch}
.dim{color:var(--muted)}
.tiny{font-size:.76rem;line-height:1.5}

/* ── buttons ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:99px;border:1px solid transparent;
  font:500 .82rem/1 'DM Sans',sans-serif;text-decoration:none;transition:.16s}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-primary:hover{background:#2c2013}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#94702f}
.btn-ghost{background:transparent;color:var(--body);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:8px 15px;font-size:.75rem}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* ── fields ────────────────────────────────────────────── */
.field{display:block;margin-bottom:16px}
.field > span{display:block;font:500 .7rem/1 'DM Sans',sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--paper);transition:.16s}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-wash)}
textarea.inp{min-height:132px;resize:vertical;line-height:1.65}

/* ── cards ─────────────────────────────────────────────── */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:26px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}

/* ── gate (landing) ────────────────────────────────────── */
.gate{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:48px 24px}
.gate-inner{width:100%;max-width:880px;text-align:center}
.gate h1{font-size:clamp(2.3rem,5.4vw,3.5rem);margin-bottom:16px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:20px;margin-top:42px;text-align:left}
.door{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:30px 28px 26px;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}
.door:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.door h3{font-size:1.5rem;margin:14px 0 8px}
.door p{margin:0 0 20px;font-size:.88rem;line-height:1.6;color:var(--body)}
.door-ico{width:38px;height:38px;color:var(--gold)}

/* ── badges ────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;
  font:500 .67rem/1.5 'DM Sans',sans-serif;letter-spacing:.04em;
  background:var(--gold-wash);color:var(--gold)}
.badge-live{background:var(--live-wash);color:var(--live)}
.badge-draft{background:var(--draft-wash);color:var(--wait)}
.badge-flag{background:rgba(180,66,47,.1);color:#a63d2b}

/* ── class code ────────────────────────────────────────── */
.code{font:700 1.5rem/1 'DM Sans',sans-serif;letter-spacing:.34em;
  color:var(--ink);font-variant-numeric:tabular-nums}
.code-lg{font-size:2.6rem;letter-spacing:.4em}

/* ── layout: teacher ───────────────────────────────────── */
.cols{display:grid;grid-template-columns:288px 1fr;gap:32px;align-items:start;padding:34px 0 80px}
.side .card{padding:20px}
.side h3{font-size:1.15rem;margin-bottom:14px}
.class-row{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:var(--r);
  border:1px solid transparent;background:transparent;margin-bottom:5px;transition:.14s}
.class-row:hover{background:var(--cream)}
.class-row[aria-current="true"]{background:var(--gold-wash);border-color:rgba(169,128,60,.25)}
.class-row b{display:block;font-weight:500;font-size:.9rem}
.class-row span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── tabs ──────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:26px;overflow-x:auto}
.tab{padding:11px 17px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font:500 .82rem/1 'DM Sans',sans-serif;white-space:nowrap;transition:.14s}
.tab:hover{color:var(--body)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}

/* ── briefs ────────────────────────────────────────────── */
.brief{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--paper);
  padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.brief-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
.brief h3{font-size:1.42rem}
.brief-meta{font:500 .68rem/1 'DM Sans',sans-serif;letter-spacing:.11em;
  text-transform:uppercase;color:var(--gold);margin:7px 0 14px}
.brief-arc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.arc{background:var(--cream);border-radius:var(--r);padding:14px 15px}
.arc b{display:block;font:500 .68rem/1 'DM Sans',sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.arc p{margin:0;font-size:.84rem;line-height:1.58;color:var(--body)}
.turnin{background:var(--cream);border-left:2px solid var(--gold);padding:14px 17px;
  border-radius:0 var(--r) var(--r) 0;margin:16px 0;font-size:.86rem;line-height:1.62;color:var(--body)}
.standards{font-size:.75rem;line-height:1.6;color:var(--muted);padding-top:14px;border-top:1px solid var(--rule-soft)}

/* ── pattern strip ─────────────────────────────────────── */
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.pat{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--rule);background:var(--cream);cursor:pointer;transition:.15s}
.pat:hover{border-color:var(--gold);transform:scale(1.03)}
.pat img{width:100%;height:100%;object-fit:cover;display:block}
.pat-cap{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(26,18,8,.86));
  color:#fff;font-size:.6rem;line-height:1.3;padding:14px 6px 5px;opacity:0;transition:.15s}
.pat:hover .pat-cap{opacity:1}

/* ── gallery ───────────────────────────────────────────── */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:18px}
.work{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow);transition:.16s}
.work:hover{box-shadow:var(--shadow-lg)}
.work-img{aspect-ratio:1;background:var(--cream);display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--rule-soft);cursor:pointer}
.work-img img{width:100%;height:100%;object-fit:cover;display:block}
.work-body{padding:14px 16px 16px}
.work-body b{display:block;font-weight:500;font-size:.92rem;margin-bottom:3px}
.work-body .tiny{color:var(--muted)}
.work-acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

/* ── empty ─────────────────────────────────────────────── */
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty h3{font-size:1.3rem;color:var(--ink);margin-bottom:8px}

/* ── student ───────────────────────────────────────────── */
.stu{max-width:820px;margin:0 auto;padding:34px 0 80px}
.join{max-width:420px;margin:0 auto;padding:64px 0}
.code-in{width:100%;padding:18px;text-align:center;font:700 1.7rem/1 'DM Sans',sans-serif;
  letter-spacing:.34em;text-transform:uppercase;border:1px solid var(--rule);
  border-radius:var(--r);background:var(--paper)}
.code-in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-wash)}
.step{display:flex;gap:15px;padding:19px 0;border-bottom:1px solid var(--rule-soft)}
.step:last-child{border-bottom:none}
.step-n{flex:0 0 27px;height:27px;border-radius:50%;background:var(--gold-wash);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font:700 .76rem/1 'DM Sans',sans-serif;font-variant-numeric:tabular-nums}
.step-n.done{background:var(--live-wash);color:var(--live)}
.step-b{flex:1;min-width:0}
.step-b h4{margin:0 0 5px;font:500 .96rem/1.3 'DM Sans',sans-serif}
.step-b p{margin:0 0 11px;font-size:.85rem;line-height:1.6;color:var(--body)}
.drop{border:1.5px dashed var(--rule);border-radius:var(--r);padding:26px;text-align:center;
  cursor:pointer;transition:.15s;background:var(--cream)}
.drop:hover{border-color:var(--gold);background:var(--gold-wash)}
.drop img{max-width:100%;max-height:250px;border-radius:6px;display:block;margin:0 auto}

/* ── process receipts ──────────────────────────────────── */
.recs{margin:0;padding:0;list-style:none;font-size:.8rem}
.rec{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.rec:last-child{border-bottom:none}
.rec time{flex:0 0 128px;color:var(--faint);font-size:.72rem;font-variant-numeric:tabular-nums}
.rec b{font-weight:500}

/* ── modal ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(20,14,6,.62);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--paper);border-radius:var(--r-lg);width:min(680px,100%);
  max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:24px 26px 0}
.modal-b{padding:18px 26px 26px}
.x{background:none;border:none;font-size:1.5rem;line-height:1;color:var(--muted);padding:0 4px}
.x:hover{color:var(--ink)}

/* ── toast ─────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:99px;
  font-size:.84rem;z-index:400;opacity:0;transition:.24s;pointer-events:none;max-width:88vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ── field notes ───────────────────────────────────────── */
.notes{margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.fnote{border:1px solid var(--rule);border-radius:var(--r);background:var(--cream);
  padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.fnote-img{flex:0 0 62px;height:62px;border-radius:6px;overflow:hidden;background:var(--rule-soft)}
.fnote-img img{width:100%;height:100%;object-fit:cover;display:block}
.fnote-b{flex:1;min-width:0}
.fnote-b .src{font:500 .68rem/1 'DM Sans',sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.fnote-b p{margin:0 0 5px;font-size:.86rem;line-height:1.55;color:var(--ink)}
.fnote-b .surp{font-size:.79rem;line-height:1.5;color:var(--body);font-style:italic}
.fnote-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.kind{padding:6px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--paper);
  font:500 .72rem/1 'DM Sans',sans-serif;color:var(--body);transition:.14s}
.kind[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.needs{font-size:.78rem;line-height:1.5;margin:10px 0 0}

.note{background:var(--gold-wash);border-radius:var(--r);padding:13px 16px;
  font-size:.82rem;line-height:1.6;color:var(--body);margin:16px 0}
.note b{color:var(--gold)}

/* ═══════════════════════════════════════════════════════════════
   STUDENT SKIN
   Two audiences, two treatments. A teacher is deciding whether to
   trust this, so their surface stays calm and credible. A fifteen-
   year-old is deciding whether it is worth their time, and cream-
   and-gold reads to them as a worksheet.

   The accent is not a brand colour — it is taken from the palette of
   the tradition they are studying, lifted until it clears 4.5:1 on
   the ground. Adinkra goes russet and gold, shibori goes indigo. You
   learn a palette faster by being inside it.
   ═══════════════════════════════════════════════════════════════ */
body.skin{
  --cream:#17120e; --paper:#241c16; --ink:#fdf9f3; --body:#d8cec1;
  --muted:#9c8f7e; --faint:#6d6255;
  --gold:#ffb020; --gold-wash:rgba(255,176,32,.14);
  --rule:#3a2e24; --rule-soft:#2c2219;
  --live:#4ade80; --live-wash:rgba(74,222,128,.14);
  --wait:#fbbf24; --draft-wash:rgba(251,191,36,.16);
  --r:14px; --r-lg:22px;
  --shadow:0 2px 4px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  background:var(--cream);
}
body.skin .topbar{background:#1d1610;border-bottom-color:var(--rule)}
body.skin .mark{color:var(--ink)}
body.skin .btn-primary{background:var(--gold);color:#17120e;font-weight:700}
body.skin .btn-primary:hover{filter:brightness(1.12)}
body.skin .btn-gold{background:var(--gold);color:#17120e;font-weight:700}
body.skin .btn-ghost{border-color:var(--rule);color:var(--body)}
body.skin .btn-ghost:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-wash)}
body.skin .inp{background:#1c1510;border-color:var(--rule);color:var(--ink)}
body.skin .inp::placeholder{color:var(--faint)}
body.skin .card,body.skin .brief{background:var(--paper);border-color:var(--rule)}
body.skin .arc,body.skin .turnin,body.skin .drop,body.skin .fnote{background:#1c1510}
body.skin .pat{background:#1c1510;border-color:var(--rule)}
body.skin .kind{background:#1c1510;border-color:var(--rule);color:var(--body)}
body.skin .kind[aria-pressed="true"]{background:var(--gold);color:#17120e;border-color:var(--gold)}
body.skin .modal{background:var(--paper)}
body.skin #toast{background:var(--gold);color:#17120e;font-weight:500}

/* Louder type. A brief should read like a poster, not a permission slip. */
body.skin .stu h1{font-size:clamp(2.1rem,6.4vw,3.1rem);letter-spacing:-.015em}
body.skin .brief h3{font-size:1.72rem}
body.skin .eyebrow{letter-spacing:.2em;font-weight:700;font-size:.64rem}
body.skin .step-b h4{font-size:1.18rem;font-weight:700;letter-spacing:-.01em}
body.skin .step-b p{font-size:.92rem;color:var(--body)}
body.skin .lede{font-size:1.06rem;color:var(--body)}

/* The step markers carry the progress, so make them read across a room. */
body.skin .step{gap:18px;padding:24px 0;border-bottom-color:var(--rule-soft)}
body.skin .step-n{flex:0 0 40px;height:40px;font-size:1rem;font-weight:700;
  background:#2c2219;color:var(--muted);border:2px solid var(--rule)}
body.skin .step-n.done{background:var(--live);color:#0b2416;border-color:var(--live)}

body.skin .badge{font-weight:700;font-size:.7rem}
body.skin .badge-live{background:var(--live-wash);color:var(--live)}
body.skin .badge-draft{background:var(--draft-wash);color:var(--wait)}
body.skin .code-in{background:#1c1510;border-color:var(--rule);color:var(--ink);
  font-size:2rem;letter-spacing:.4em}
body.skin .fnote-b .src{font-weight:700}
body.skin .brief-meta{font-weight:700;letter-spacing:.14em}

/* Progress across the whole brief — the thing that makes a game a game. */
.prog{display:flex;gap:6px;margin:18px 0 0}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--rule);transition:.3s}
.prog i.on{background:var(--gold)}
body.skin .prog i.on{box-shadow:0 0 14px var(--gold-wash)}

/* The tradition's own colours, shown as a bar the student can see. */
.tradstrip{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:14px 0 0}
.tradstrip i{flex:1}

@media (max-width:860px){
  .cols{grid-template-columns:1fr;gap:22px}
  .wrap{padding:0 18px}
  body.skin .step-n{flex:0 0 34px;height:34px;font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.btn,.tabs,.work-acts{display:none!important}}
</style>

<div class="topbar"><div class="wrap">
  <div class="mark">CoCo<small>Print Studio for Schools</small></div>
  <div class="topbar-right" id="topRight"></div>
</div></div>

<main id="app"></main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const SUPA_URL  = 'https://qwulthvbwujfehgdegtn.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3dWx0aHZid3VqZmVoZ2RlZ3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQyMDcxODIsImV4cCI6MjA1OTc4MzE4Mn0.t9n4eZng6d0jggiPNK-J_DByvEE2L9tqy5Xh_1-TSoQ';
const PRINT_STUDIO = 'https://coco-print-studio.cultureschool.org';
const UPLOAD_FN    = SUPA_URL + '/functions/v1/school-upload';
const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);

/* Demo mode is an explicit opt-in: coco-print-studio-school…/?demo=1
   It runs entirely on localStorage with a seeded class, so a showroom
   laptop with no wifi still tells the whole story. Everything else
   talks to the real backend. The two paths never mix. */
const DEMO = /[?&]demo=1/.test(location.search);

/* ══════════════════════════════════════════════════════════════
   INTERPRETATION BRIEFS
   Verbatim from docs/print-studio-school-docs. The server holds the
   same three as templates in public.briefs with the word floors, so
   the turn-in limit is not the client's to relax.

   `style` binds a brief to a real pattern style in patterns_public
   so the reference strip is live archive content, not stock art.
   null = the archive has no matching style yet.
   ══════════════════════════════════════════════════════════════ */
const BRIEFS = [
  {

/* Downscale before upload. A Print Studio export is a full-resolution
   PNG; long-edge 1400 at q0.85 keeps it legible on a projector and well
   under the bucket's 8MB ceiling. */
function fileToJpeg(file, edge=1400){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('read failed'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('not an image'));
      img.onload=()=>{
        const s=Math.min(1, edge/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        const x=c.getContext('2d');
        x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
        x.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.85));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ══════════════════════════════════════════════════════════════
   PATTERN ARCHIVE — school_safe by construction
   Patterns are CultureSchool's own generated works referencing
   traditions, so they are owned outright and need no per-row rights
   check. The school gate is simply "patterns only": the three
   external libraries (Openverse / Met / Iconify) are not reachable
   from this surface at all.
   ══════════════════════════════════════════════════════════════ */
const THUMB_BASE = SUPA_URL + '/storage/v1/object/public/pattern-thumbs/';
const _patCache = {};
async function patternsForStyle(style, limit=12){
  if(!style) return [];
  if(_patCache[style]) return _patCache[style];
  try{
    const { data, error } = await sb.from('patterns_public')
      .select('id,name,style,colors,heritage_origin,continent,thumb_url')
      .eq('style', style)
      .not('heritage_origin','is',null)   /* 27% of the archive has no origin — those
                                             cannot carry a credit line, so they are
                                             excluded from school use */
      .limit(limit);
    if(error) throw error;
    _patCache[style] = data || [];
    return _patCache[style];
  }catch(e){ console.warn('[patterns]', e); return []; }
}
const thumbUrl = p => p.thumb_url || (THUMB_BASE + p.id + '.png');

/* ── skinning the student surface from a real tradition ──────────────
   The accent must be vivid AND readable. Tradition palettes are fully
   saturated but often very dark — shibori's #100100 scores 1.1:1 on our
   ground, which is invisible. So: rank by saturation, then lift each
   candidate until it clears 4.5:1, and take the first that survives
   without becoming pastel. Falls back to CoCo gold. */
const _hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const _rgb2hex = c => '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v)))
  .toString(16).padStart(2,'0')).join('');
function _lum(hex){
  return _hex2rgb(hex).map(v=>v/255)
    .map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4))
    .reduce((a,v,i)=>a+[.2126,.7152,.0722][i]*v,0);
}
function contrast(a,b){ const x=_lum(a),y=_lum(b);
  return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function _sat(hex){ const [r,g,b]=_hex2rgb(hex);
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); return mx===0?0:(mx-mn)/mx; }
function _lift(hex,amt){ return _rgb2hex(_hex2rgb(hex).map(v=>v+(255-v)*amt)); }

const GROUND='#17120e', DEFAULT_ACCENT='#ffb020';
function accentFrom(colors){
  const pool=(colors||[]).filter(c=>/^#[0-9a-f]{6}$/i.test(c));
  if(!pool.length) return DEFAULT_ACCENT;
  const ranked=[...new Set(pool.map(c=>c.toLowerCase()))]
    .map(c=>({c, s:_sat(c)}))
    .sort((a,b)=>b.s-a.s);
  for(const {c} of ranked){
    if(contrast(c,GROUND)>=4.5) return c;
    /* lift toward white in steps; stop before it turns to chalk */
    for(const amt of [.2,.35,.5,.62]){
      const lifted=_lift(c,amt);
      if(contrast(lifted,GROUND)>=4.5 && _sat(lifted)>=.28) return lifted;
    }
  }
  return DEFAULT_ACCENT;
}

/* Paint the student surface in the tradition being studied. */
async function skinFor(brief){
  const root=document.body;
  if(!brief || !brief.style){
    root.style.removeProperty('--gold');
    root.style.removeProperty('--gold-wash');
    _tradColors=[]; return;
  }
  const rows=await patternsForStyle(brief.style, 8);
  const cols=[...new Set(rows.flatMap(r=>r.colors||[]))];
  _tradColors=cols.slice(0,6);
  const a=accentFrom(cols);
  root.style.setProperty('--gold', a);
  root.style.setProperty('--gold-wash', 'rgba('+_hex2rgb(a).join(',')+',.16)');
}
let _tradColors=[];
function creditFor(p){
  const bits=[p.heritage_origin, p.continent].filter(Boolean);
  return bits.length ? bits.join(' · ') : 'CultureSchool Pattern Archive';
}

function render(){
  const R={ gate:viewGate, teacher:viewTeacher, join:viewJoin, student:viewStudent };
  /* Only students get the loud treatment. A teacher is deciding whether
     to trust this, and trust is quieter. */
  const student = State.view==='student' || State.view==='join';

  if(!student){ document.body.style.removeProperty('--gold');
                document.body.style.removeProperty('--gold-wash'); }

  renderTopRight();

  if(State.view==='teacher') hydrateGalleryImages();

      .then(()=>{ const st=document.getElementById('tradStrip');
        if(st && _tradColors.length)
          st.innerHTML=_tradColors.map(c=>`<i style="background:${esc(c)}"></i>`).join(''); });
  }
}

function renderTopRight(){

    el.innerHTML = `<span class="tiny">${esc(State.session.name)}</span>
      <button class="btn btn-ghost btn-sm" onclick="leaveClass()">Leave</button>`;

  } else el.innerHTML = DEMO ? `<span class="badge badge-draft">Demo mode</span>` : '';

/* Surface a failure rather than leaving a spinner spinning. */
function fail(e){
  const m = String(e && e.message || e);
  if(m==='UPLOAD_FN_MISSING'){
    toast('Uploads are not switched on yet — the school-upload function needs deploying');
  } else if(/permission denied|sign in required/i.test(m)){
    toast('Please sign in again');
  } else toast(m.slice(0,120));
  console.warn('[school]', e);
}

function teacherSignIn(){

               autocomplete="email" onkeydown="if(event.key==='Enter')sendLink()"></label>
      <button class="btn btn-primary" style="width:100%" id="tBtn" onclick="sendLink()">
        Email me a sign-in link →</button>
      <p class="tiny dim" style="margin:14px 0 0;text-align:center;line-height:1.6">

async function sendLink(){
  const v=$('#tEmail').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return toast('Enter a valid email address');
  const btn=$('#tBtn'); btn.disabled=true; btn.textContent='Sending…';
  try{
    const { error } = await sb.auth.signInWithOtp({ email:v,
      options:{ emailRedirectTo: location.origin + location.pathname } });
    if(error) throw error;
    $('#tMsg').textContent = 'Check ' + v + ' — the link opens straight into your dashboard.';
    btn.textContent = 'Link sent';
  }catch(e){ fail(e); btn.disabled=false; btn.textContent='Email me a sign-in link →'; }
}

async function signOut(){
  try{ await sb.auth.signOut(); }catch(_){}
  State.teacher=null; State.classes=[]; State.classId=null;
  go('gate');
}

async function loadTeacher(){
  if(DEMO){ State.classes = Store.classes(State.teacher).map(c=>({
      id:c.id, code:c.code, name:c.name, join_open:true, assigned:c.assigned,
      students:Store.members(c.id).length,
      submitted:Store.works(c.id).filter(w=>w.status==='submitted').length }));
    State.briefs = BRIEFS.map(b=>({...b, is_template:true,
      assigned:(Store.classById(State.classId)?.assigned||[]).includes(b.id)})); }
  else {
    try{ State.classes = await API.classes() || []; }
    catch(e){ fail(e); State.classes=[]; }
  }
  if(!State.classId || !curClass()) State.classId = State.classes[0]?.id || null;
  if(State.classId) await loadClass(State.classId);
  render();
}

async function loadClass(id){
  if(DEMO){
    State.roster = Store.members(id).map(m=>({ member_id:m.id, display_name:m.name,
      joined_at:m.joinedAt,
      submitted:Store.works(id).filter(w=>w.memberId===m.id&&w.status==='submitted').length,
      drafts:Store.works(id).filter(w=>w.memberId===m.id&&w.status==='draft').length }));
    State.gallery = Store.works(id).filter(w=>w.status==='submitted').map(w=>({
      work_id:w.id, member_id:w.memberId, brief_id:w.briefId,
      display_name:(Store.members(id).find(m=>m.id===w.memberId)||{}).name,
      image_path:null, _url:w.image, credits:w.credits, featured:w.featured,
      submitted_at:w.submittedAt }));
    return;
  }
  try{
    const [r,g] = await Promise.all([API.roster(id), API.gallery(id)]);
    State.roster = r||[]; State.gallery = g||[];
  }catch(e){ fail(e); State.roster=[]; State.gallery=[]; }

  /* Brief authoring is a later migration than the rest. If it has not been
     applied yet, fall back to the three shipped briefs read-only and say
     so, rather than leaving the teacher on a broken tab. */
  try{
    State.briefs = await API.classBriefs(id) || [];
    State.briefsReadOnly = false;
  }catch(e){
    const c = State.classes.find(x=>x.id===id);
    State.briefs = BRIEFS.map(b=>({ ...b, is_template:true,
      turnin:b.turnin, assigned:(c?.assigned||[]).includes(b.id) }));
    State.briefsReadOnly = true;
  }
  if(!State.briefsReadOnly && !State.styles.length){
    try{ State.styles = await API.patternStyles() || []; }catch(_){ State.styles=[]; }
  }
}

async function newClass(){
  const name=prompt('Class name — e.g. "Period 3 · Visual Arts"');
  if(!name || !name.trim()) return;
  try{
    if(DEMO){
      let code; do{ code=Array.from({length:6},()=>
        'ABCDEFGHJKLMNPQRTUVWXY2346789'[Math.floor(Math.random()*29)]).join('');
      }while(Store.classByCode(code));
      Store.addClass({ id:uid(), code, name:name.trim(), teacher:State.teacher,
        assigned:[], createdAt:Date.now() });
      await loadTeacher();
      toast('Class created — code '+code);
    } else {
      const c = await API.createClass(name.trim());
      await loadTeacher();
      State.classId = c.id; await loadClass(c.id); render();
      toast('Class created — code ' + c.code);
    }
  }catch(e){ fail(e); }
}

/* ── the brief editor ─────────────────────────────────────────────── */
function editBrief(id){
  const b = id ? State.briefs.find(x=>x.id===id) : null;
  State.editing = b ? {...b} : { id:null, title:'', tradition:'', meta:'', find:'',
    interpret:'', own:'', turnin:'', style:'', words:150, min_notes:2, standards:'' };
  openEditor();
}
function duplicateBrief(id){
  const b = State.briefs.find(x=>x.id===id); if(!b) return;
  State.editing = {...b, id:null, title:b.title+' (my version)'};
  openEditor();
}

function openEditor(){

  scrim.onclick=e=>{ if(e.target===scrim) scrim.remove(); };

    <div class="modal-h">
      <div><p class="eyebrow">${b.id?'Edit brief':'New brief'}</p>
        <h2 style="font-size:1.5rem;margin-top:6px">Write the assignment</h2></div>
      <button class="x" onclick="this.closest('.scrim').remove()" aria-label="Close">×</button>
    </div>
    <div class="modal-b">
      <label class="field"><span>Title</span>
        <input class="inp" id="bTitle" maxlength="160" value="${esc(b.title)}"
               placeholder="e.g. Kuba Cloth: Improvised Geometry"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label class="field"><span>Tradition</span>
          <input class="inp" id="bTrad" value="${esc(b.tradition||'')}"
                 placeholder="Kuba · Kuba Kingdom, DRC"></label>
        <label class="field"><span>Grades &amp; length</span>
          <input class="inp" id="bMeta" value="${esc(b.meta||'')}"
                 placeholder="Grades 9–12 · Visual Arts · 2 weeks"></label>
      </div>

      <label class="field"><span>1 · Find — what should they research?</span>
        <textarea class="inp" id="bFind" style="min-height:96px"

      <label class="field"><span>2 · Interpret — what should they make?</span>
        <textarea class="inp" id="bInt" style="min-height:96px"
          placeholder="What do they design, and which idea from the tradition carries over?">${esc(b.interpret||'')}</textarea></label>
      <label class="field"><span>3 · Own it — what goes in the artist statement?</span>
        <textarea class="inp" id="bOwn" style="min-height:80px"
          placeholder="What must they name: borrowed, changed, and why.">${esc(b.own||'')}</textarea></label>
      <label class="field"><span>Turn-in checklist</span>
        <input class="inp" id="bTurn" value="${esc(b.turnin||'')}"

        <label class="field"><span>Reference patterns</span>
          <select class="inp" id="bStyle">
            <option value="">None — students compose freely</option>
            ${State.styles.map(s=>`<option value="${esc(s.style)}"
              ${s.style===b.style?'selected':''}>${esc(s.style)} — ${s.patterns} patterns</option>`).join('')}
          </select></label>
        <label class="field"><span>Statement must reach</span>
          <input class="inp" id="bWords" type="number" min="25" max="2000" step="25"
                 value="${b.words||150}"></label>
      </div>
      <label class="field"><span>Documented sources required</span>
        <input class="inp" id="bNotes" type="number" min="0" max="20" step="1"
               value="${b.min_notes ?? 0}">
        <span style="display:block;text-transform:none;letter-spacing:0;font-weight:400;
              font-size:.78rem;color:var(--muted);margin-top:7px">
          Students record what they found and where — a museum, a book, a person, a place.
          Set 0 and the research step is optional.</span></label>
      <label class="field"><span>Standards (comma separated)</span>
        <input class="inp" id="bStd" value="${esc(std)}"

      <p class="tiny dim" style="margin:0 0 16px;line-height:1.6">

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="bSave" onclick="saveBriefForm()">

      </div>
    </div></div>`;
  document.body.appendChild(scrim);
}

async function saveBriefForm(){
  const c=curClass(); if(!c) return;
  const b={
    id: State.editing.id,
    title: $('#bTitle').value.trim(),
    tradition: $('#bTrad').value.trim(),
    meta: $('#bMeta').value.trim(),
    find: $('#bFind').value.trim(),
    interpret: $('#bInt').value.trim(),
    own: $('#bOwn').value.trim(),
    turnin: $('#bTurn').value.trim(),
    style: $('#bStyle').value,
    words: parseInt($('#bWords').value,10) || 150,
    min_notes: Math.max(0, parseInt($('#bNotes').value,10) || 0),
    standards: $('#bStd').value.split(',').map(x=>x.trim()).filter(Boolean)
  };
  if(!b.title) return toast('Give the brief a title');
  const btn=$('#bSave'); btn.disabled=true; btn.textContent='Saving…';
  try{
    await API.saveBrief(c.id, b);
    document.getElementById('briefEditor')?.remove();
    State.editing=null;
    await loadClass(c.id); render();
    toast(b.id?'Brief saved':'Brief created — assign it when you are ready');
  }catch(e){ btn.disabled=false; btn.textContent='Save →'; fail(e); }
}

async function removeBrief(id){
  const c=curClass(); if(!c) return;
  const b=State.briefs.find(x=>x.id===id);
  if(!confirm('Delete "'+(b?b.title:'this brief')+'"? This cannot be undone.')) return;
  try{
    await API.deleteBrief(c.id, id);
    await loadClass(c.id); render();
    toast('Brief deleted');
  }catch(e){
    const m=String(e.message||e);
    if(/piece\(s\) of student work/.test(m))
      toast('Students have already worked on this — unassign it instead of deleting');
    else fail(e);
  }
}

async function toggleAssign(briefId){
  const c=curClass(); if(!c) return;
  const next=[...(c.assigned||[])];
  const i=next.indexOf(briefId);
  if(i>=0) next.splice(i,1); else next.push(briefId);
  try{
    if(DEMO) Store.updClass(c.id,{assigned:next});
    else await API.setAssigned(c.id,next);
    await loadTeacher();
    toast(i>=0 ? 'Unassigned' : 'Assigned — students see it on their next visit');
  }catch(e){ fail(e); }
}

async function resetMember(memberId){

  if(!confirm('Sign this student out of every device? Their work is kept.')) return;
  try{
    if(DEMO){ const m=Store.all().members.find(x=>x.id===memberId); if(m){m.device=null; Store._save();} }

    await loadClass(c.id); render();
    toast('Signed out — they can rejoin with the same name');
  }catch(e){ fail(e); }

   session, so they sign their own URLs and the storage policy decides
   whether the object belongs to a class they teach. */
async function hydrateGalleryImages(){
  if(DEMO) return;
  const nodes=[...document.querySelectorAll('.work-img[data-path]')].filter(n=>n.dataset.path);

function hydratePatterns(){
  document.querySelectorAll('.pats[data-style]').forEach(async el=>{
    const rows=await patternsForStyle(el.dataset.style, 8);
    el.innerHTML = rows.length ? rows.map(p=>`
      <div class="pat" title="${esc(p.name)}">
        <img src="${esc(thumbUrl(p))}" alt="${esc(p.name)}" loading="lazy"
             onerror="this.closest('.pat').style.display='none'">
        <div class="pat-cap">${esc(creditFor(p))}</div>
      </div>`).join('') : '<p class="tiny dim">Archive unavailable.</p>';
  });
}

/* ══════════════════════════════════════════════════════════════
   WORK DETAIL — statement beside the receipts that produced it
   ══════════════════════════════════════════════════════════════ */
async function openWork(workId){
  const c=curClass(); if(!c) return;
  let d;
  if(DEMO){
    const w=Store.work(workId); if(!w) return;
    const m=Store.members(w.classId).find(x=>x.id===w.memberId);
    d={ name:m?m.name:'—', brief_id:w.briefId, statement:w.statement, credits:w.credits,
        featured:w.featured, image_path:null, _url:w.image,
        receipts:Store.events(w.classId,w.memberId).map(e=>({kind:e.kind,detail:e.detail,at:e.at})) };
  } else {
    try{ d = await API.workDetail(c.id, workId); }catch(e){ return fail(e); }
    d._url = await signedForTeacher(d.image_path);
  }
  const b=briefById(d.brief_id);
  const scrim=document.createElement('div');
  scrim.className='scrim';
  scrim.onclick=e=>{ if(e.target===scrim) scrim.remove(); };
  scrim.innerHTML=`<div class="modal">
    <div class="modal-h">
      <div><p class="eyebrow">${esc(b?b.title:d.brief_id)}</p>
        <h2 style="font-size:1.55rem;margin-top:6px">${esc(d.name||'—')}</h2></div>
      <button class="x" onclick="this.closest('.scrim').remove()" aria-label="Close">×</button>
    </div>
    <div class="modal-b">
      ${d._url?`<img src="${esc(d._url)}" alt="" style="width:100%;border-radius:var(--r);border:1px solid var(--rule)">`
              :'<p class="tiny dim">No image.</p>'}
      ${(d.credits||[]).length?`<p class="tiny dim" style="margin:10px 0 0">
        <b>Works cited —</b> ${(d.credits||[]).map(esc).join(' · ')}</p>`:''}

      <h3 style="font-size:1.15rem;margin:24px 0 6px">Where they looked</h3>
      <p class="tiny dim" style="margin:0 0 12px">${(d.notes||[]).length
        ? 'The sources they documented before making anything. A photograph they took themselves is the hardest thing to fake.'
        : 'No sources documented.'}</p>
      ${(d.notes||[]).length?`<div class="notes">${d.notes.map(n=>`
        <div class="fnote">
          ${n.image_path?`<div class="fnote-img" data-tnote-img="${esc(n.image_path)}"></div>`:''}
          <div class="fnote-b">
            <div class="src">${esc(kindLabel(n.kind))}${n.source?' · '+esc(n.source):''}</div>
            <p>${esc(n.found)}</p>
            ${n.surprised?`<p class="surp">What surprised me — ${esc(n.surprised)}</p>`:''}
            ${n.link?`<p class="tiny"><a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(String(n.link).slice(0,60))}</a></p>`:''}
            <p class="tiny dim" style="margin-top:6px">${fmtWhen(n.created_at)}</p>
          </div>
        </div>`).join('')}</div>`:''}

      <h3 style="font-size:1.15rem;margin:26px 0 8px">Artist statement</h3>
      <p style="font-size:.9rem;line-height:1.72;color:var(--body);white-space:pre-wrap">${esc(d.statement||'—')}</p>
      <p class="tiny dim" style="margin-top:6px">${words(d.statement)} words${b?` · ${b.words} required`:''}</p>

      <h3 style="font-size:1.15rem;margin:26px 0 8px">How it was made</h3>
      <p class="tiny dim" style="margin:0 0 12px">Process receipts are class-scoped and visible only to you.
        They exist so a finished print can be read alongside the work that produced it.</p>
      <ul class="recs">${ (d.receipts||[]).length ? d.receipts.map(e=>`<li class="rec">
        <time>${fmtWhen(e.at)}</time><span><b>${esc(RECS[e.kind]||e.kind)}</b>${e.detail?' — '+esc(e.detail):''}</span>
      </li>`).join('') : '<li class="tiny dim">No activity recorded.</li>' }</ul>

      <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="toggleFeature('${workId}',${!d.featured})">
          ${d.featured?'★ Unfeature':'☆ Feature'}</button>
        <button class="btn btn-ghost btn-sm" onclick="window.print()">Print this work</button>
      </div>
    </div></div>`;
  document.body.appendChild(scrim);
  /* Note photographs are in the private bucket; the teacher's session
     signs them, and the storage policy decides whether the object
     belongs to a class they teach. */
  scrim.querySelectorAll('[data-tnote-img]').forEach(async el=>{
    const url=await signedForTeacher(el.dataset.tnoteImg);
    if(url) el.innerHTML=`<img src="${esc(url)}" alt="">`;
  });
}
const RECS={ join:'Joined the class', open_brief:'Opened the brief',
  view_tradition:'Studied a tradition card', open_studio:'Opened Print Studio',
  attach:'Attached a print', save_draft:'Saved a draft statement',
  submit:'Submitted the work', resubmit:'Revised and resubmitted',
  field_note:'Recorded a source', note_photo:'Photographed a source' };

async function toggleFeature(workId,on){
  const c=curClass(); if(!c) return;
  try{
    if(DEMO) Store.updWork(workId,{featured:on});
    else await API.feature(c.id, workId, on);
    document.querySelector('.scrim')?.remove();
    await loadClass(c.id); render();
  }catch(e){ fail(e); }
}

/* ══════════════════════════════════════════════════════════════
   STUDENT — join
   ══════════════════════════════════════════════════════════════ */
function viewJoin(){
  return `<div class="join">
    <p class="eyebrow" style="text-align:center">Student</p>
    <h1 style="font-size:clamp(2rem,7vw,2.6rem);text-align:center;margin:10px 0 26px;letter-spacing:-.015em">Join your class</h1>
    <div class="card">
      <label class="field"><span>Class code</span>
        <input class="code-in" id="jCode" maxlength="6" autocomplete="off"
               autocapitalize="characters" spellcheck="false" placeholder="ABC234"
               oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
               onkeydown="if(event.key==='Enter')document.getElementById('jName').focus()"></label>
      <label class="field"><span>Your name</span>
        <input class="inp" id="jName" placeholder="e.g. Maya R." autocomplete="off"
               onkeydown="if(event.key==='Enter')doJoin()"></label>
      <button class="btn btn-gold" style="width:100%" id="jBtn" onclick="doJoin()">Join →</button>
      <p class="tiny dim" style="margin:16px 0 0;text-align:center;line-height:1.6">
        Use the name format your teacher asked for — usually your first name and last initial.
        <b>Never your full name, email, or anything else about you.</b></p>
    </div>
  </div>`;
}

async function doJoin(){
  const code=$('#jCode').value.trim().toUpperCase();
  const name=$('#jName').value.trim();
  if(code.length!==6) return toast('A class code is six characters');
  if(!name)           return toast('Add the name your class will see');
  if(name.length>28)  return toast('That name is too long');
  if(/@/.test(name))  return toast('Please use a display name, not an email address');

  const btn=$('#jBtn'); btn.disabled=true; btn.textContent='Joining…';
  try{
    if(DEMO){
      const c=Store.classByCode(code);
      if(!c) throw new Error('No class with that code — check with your teacher');
      let m=Store.member(c.id,name);
      if(!m){ m=Store.addMember({id:uid(),classId:c.id,name,device:deviceToken(),joinedAt:Date.now()});
              Store.log(c.id,m.id,'join'); }
      State.session={ token:'demo:'+m.id, name:m.name, class_name:c.name,
                      assigned:c.assigned, _cid:c.id, _mid:m.id };
    } else {
      const r=await API.join(code,name);
      State.session={ token:r.session_token, name:r.display_name,
                      class_name:r.class_name, briefs:[] };
    }
    try{ sessionStorage.setItem('cs_school_sess', JSON.stringify(State.session)); }catch(_){}
    await loadStudent();
    go('student');
  }catch(e){
    btn.disabled=false; btn.textContent='Join →';
    const m=String(e.message||e);
    toast(/no such class/i.test(m) ? 'No class with that code — check with your teacher'
        : /closed/i.test(m)        ? 'That class is closed — ask your teacher to reopen it'
        : m.slice(0,120));
  }
}

function leaveClass(){ State.session=null; State.works=[]; State.notes=[]; State.briefOpen=null;
  try{ sessionStorage.removeItem('cs_school_sess'); }catch(_){} go('gate'); }

async function loadStudent(){
  const s=State.session; if(!s) return;
  if(DEMO){
    const c=Store.classById(s._cid);
    State.session.briefs=(c?c.assigned:[]).map(briefById).filter(Boolean);
    State.works=Store.works(s._cid).filter(w=>w.memberId===s._mid).map(w=>({
      brief_id:w.briefId, statement:w.statement, credits:w.credits,
      status:w.status, submitted_at:w.submittedAt, _url:w.image }));
    return;
  }
  try{
    const st=await API.state(s.token);
    State.session.name=st.display_name; State.session.class_name=st.class_name;
    /* Full brief content comes from the server, so a brief the teacher
       wrote themselves renders exactly like one that ships with CoCo. */
    State.session.briefs=st.briefs||[];
    State.notes=st.notes||[];
    State.works=(st.works||[]).map(w=>({...w, _url:null}));
  }catch(e){
    /* a dead token means the teacher reset the session */
    State.session=null; try{ sessionStorage.removeItem('cs_school_sess'); }catch(_){}
    toast('Your session ended — join again with your class code');
    go('join');
  }
}
const myWork  = bid => State.works.find(w=>w.brief_id===bid);
const myNotes = bid => State.notes.filter(n=>n.brief_id===bid);

function viewStudent(){
  const s=State.session; if(!s) return viewJoin();
  const assigned=s.briefs||[];

  if(State.briefOpen){
    const b=assigned.find(x=>x.id===State.briefOpen);
    if(b) return studentBrief(b, assigned.indexOf(b));
  }
  return `<div class="wrap"><div class="stu">
    <p class="eyebrow">${esc(s.class_name||'')}</p>
    <h1>Your assignments</h1>
    <p class="tiny dim" style="margin-bottom:28px">Signed in as ${esc(s.name)} · nothing else about you is stored.</p>
    ${ assigned.length ? assigned.map((b,i)=>{
      const w=myWork(b.id);
      const st = !w ? 'Not started' : w.status==='submitted' ? 'Submitted' : 'Draft';
      const cls = !w ? '' : w.status==='submitted' ? 'badge-live' : 'badge-draft';
      return `<div class="brief">
        <div class="brief-top">
          <div><p class="eyebrow">Brief ${String(i+1).padStart(2,'0')}</p>
            <h3>${esc(b.title)}</h3>
            <p class="brief-meta">${esc(b.tradition||b.meta||'')}</p></div>

        ${(()=>{ const nt=myNotes(b.id).length>=(b.min_notes||0),
                       im=!!(w&&(w.image_path||w._url)),
                       wd=words(w?w.statement:'')>=b.words;
          return `<div class="prog" style="margin:12px 0 16px">
            <i class="${nt?'on':''}"></i><i class="${im?'on':''}"></i><i class="${wd?'on':''}"></i></div>`; })()}
        <button class="btn btn-primary btn-sm" onclick="openBrief('${b.id}')">
          ${w?'Continue →':'Start →'}</button>
      </div>`; }).join('')
    : `<div class="empty"><h3>Nothing assigned yet</h3>
        <p class="lede" style="margin:0 auto">Your teacher hasn't assigned a brief. Check back soon.</p></div>` }
  </div></div>`;
}

function openBrief(id){
  State.briefOpen=id;
  const s=State.session;
  const title=(s.briefs||[]).find(b=>b.id===id)?.title || id;
  if(DEMO) Store.log(s._cid,s._mid,'open_brief',title);
  else API.log(s.token,'open_brief',title);
  render();
}
function closeBrief(){ State.briefOpen=null; render(); }

function studentBrief(b, idx){
  const w=myWork(b.id);
  const has=!!(w && (w.image_path || w._url));
  const stmt=w?w.statement||'':'';
  const n=words(stmt), ok=n>=b.words;
  const notes=myNotes(b.id), need=b.min_notes||0;
  const gotNotes=notes.length>=need;
  const done=w&&w.status==='submitted';
  return `<div class="wrap"><div class="stu">
    <button class="btn btn-ghost btn-sm" onclick="closeBrief()">← All assignments</button>
    <p class="eyebrow" style="margin-top:22px">Brief ${String((idx||0)+1).padStart(2,'0')}${b.tradition?' · '+esc(b.tradition):''}</p>
    <h1>${esc(b.title)}</h1>
    ${b.meta?`<p class="brief-meta">${esc(b.meta)}</p>`:''}
    ${b.style?`<div class="tradstrip" id="tradStrip"></div>
      <p class="tiny dim" style="margin:8px 0 0">The colours this tradition actually uses.</p>`:''}
    <div class="prog" title="${[gotNotes,has,ok].filter(Boolean).length} of 3 done">
      <i class="${need?(gotNotes?'on':''):'on'}"></i><i class="${has?'on':''}"></i><i class="${ok?'on':''}"></i>
    </div>
    ${done?'<div class="note"><b>Turned in.</b> Your teacher can see this. You can still revise it.</div>':''}

    <div class="card" style="margin:22px 0">
      <div class="step">
        <div class="step-n ${need&&gotNotes?'done':''}">1</div>
        <div class="step-b"><h4>Find</h4><p>${esc(b.find||'Research the tradition your teacher named.')}</p>
          ${b.style?`<p class="eyebrow" style="margin:14px 0 4px">Study these — hover for the credit</p>
            <div class="pats" data-style="${b.style}"><p class="tiny dim">Loading the archive…</p></div>
            <p class="tiny dim" style="margin-top:10px">Every pattern here is CultureSchool's own work,
              made in answer to the tradition named on it. The credit is your works-cited line.</p>`
           :`<p class="tiny dim">This brief has no reference set — your composition is your own from the start.</p>`}

          <p class="eyebrow" style="margin:22px 0 4px">Your source notes${need?` · ${notes.length} of ${need}`:''}</p>
          <p class="tiny dim" style="margin:0 0 4px">Record what you find — in a museum, a book, a
            street, or from someone who knows. A photograph you took yourself is the strongest
            source there is.</p>
          ${notes.length?`<div class="notes">${notes.map(noteCard).join('')}</div>`:''}
          <button class="btn btn-ghost btn-sm" style="margin-top:12px"
            onclick="openNote('${b.id}',null)">+ Add a source note</button>
          ${need?`<p class="needs" style="color:${notes.length>=need?'var(--live)':'var(--muted)'}">
            ${notes.length>=need?'✓ You have the sources this brief asks for'
              :`This brief asks for ${need} documented source${need===1?'':'s'} before you can turn it in.`}</p>`:''}
        </div>
      </div>
      <div class="step">
        <div class="step-n ${has?'done':''}">2</div>
        <div class="step-b"><h4>Interpret</h4><p>${esc(b.interpret||'Make your print in Print Studio, then attach it here.')}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <a class="btn btn-gold btn-sm" href="${PRINT_STUDIO}" target="_blank" rel="noopener"
               onclick="logStudio()">Open Print Studio ↗</a>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('upl').click()">
              ${has?'Replace print':'Attach my print'}</button>
          </div>
          <input type="file" id="upl" accept="image/*" style="display:none" onchange="attachWork(event,'${b.id}')">
          <div class="drop" id="dropBox" onclick="document.getElementById('upl').click()">
            ${has?(w._url?`<img src="${esc(w._url)}" alt="Your print">`
                        :`<p class="tiny dim" style="margin:0">Your print is attached. Loading preview…</p>`)
                 :`<p class="tiny dim" style="margin:0">Make your print in the studio, export it,<br>then attach the file here.</p>`}
          </div>
        </div>
      </div>
      <div class="step">
        <div class="step-n ${ok?'done':''}">3</div>
        <div class="step-b"><h4>Own it</h4><p>${esc(b.own||'Write about what you borrowed, what you changed, and why.')}</p>
          <textarea class="inp" id="stmt" placeholder="What did you borrow? What did you change? Why?"
            oninput="countWords('${b.id}')">${esc(stmt)}</textarea>
          <p class="tiny" id="wc" style="margin:8px 0 0;color:${ok?'var(--live)':'var(--muted)'}">
            ${n} of ${b.words} words${ok?' ✓':''}</p>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="saveDraft('${b.id}')">Save draft</button>
            <button class="btn btn-primary btn-sm" id="subBtn" onclick="submitWork('${b.id}')"
              ${has&&ok&&gotNotes?'':'disabled'}>${done?'Turn in again':'Turn in'} →</button>
          </div>
          ${(!has||!ok||!gotNotes)?`<p class="tiny dim" style="margin:10px 0 0">
            Turn-in unlocks once you have
            ${need?`${need} source note${need===1?'':'s'}, `:''}your print attached,
            and ${b.words} words written.</p>`:''}
        </div>
      </div>
    </div>
    ${b.turnin?`<div class="turnin"><b>Turn in —</b> ${esc(b.turnin)}</div>`:''}
  </div></div>`;
}

/* ── field notes ──────────────────────────────────────────────────── */
const NOTE_KINDS = [
  ['museum','Museum or gallery'], ['place','A place'], ['person','Someone I asked'],
  ['object','An object I have'],  ['book','Book or article'], ['web','Online'],
  ['other','Somewhere else']
];
const kindLabel = k => (NOTE_KINDS.find(x=>x[0]===k)||['','Source'])[1];

function noteCard(n){
  return `<div class="fnote" data-note="${esc(n.id)}">
    ${n.image_path?`<div class="fnote-img" data-note-img="${esc(n.id)}"></div>`:''}
    <div class="fnote-b">
      <div class="src">${esc(kindLabel(n.kind))}${n.source?' · '+esc(n.source):''}</div>
      <p>${esc(n.found)}</p>
      ${n.surprised?`<p class="surp">What surprised me — ${esc(n.surprised)}</p>`:''}
      ${n.link?`<p class="tiny"><a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.link.slice(0,60))}</a></p>`:''}
      <div class="fnote-acts">
        <button class="btn btn-ghost btn-sm" onclick="openNote(null,'${esc(n.id)}')">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="notePhotoPick('${esc(n.id)}')">
          ${n.image_path?'Replace photo':'Add my photo'}</button>
        <button class="btn btn-ghost btn-sm" onclick="dropNote('${esc(n.id)}')">Delete</button>
      </div>
    </div>
  </div>`;
}

function openNote(briefId, noteId){
  const n = noteId ? State.notes.find(x=>x.id===noteId) : null;
  const brief = briefId || (n && n.brief_id) || State.briefOpen;
  const cur = n || { kind:'museum', source:'', link:'', found:'', surprised:'' };
  const scrim=document.createElement('div');
  scrim.className='scrim'; scrim.id='noteEditor';
  scrim.onclick=e=>{ if(e.target===scrim) scrim.remove(); };
  scrim.innerHTML=`<div class="modal">
    <div class="modal-h">
      <div><p class="eyebrow">${n?'Edit source note':'New source note'}</p>
        <h2 style="font-size:1.5rem;margin-top:6px">What did you find?</h2></div>
      <button class="x" onclick="this.closest('.scrim').remove()" aria-label="Close">×</button>
    </div>
    <div class="modal-b">
      <label class="field"><span>Where did you find it?</span>
        <div class="kinds" id="nKinds">
          ${NOTE_KINDS.map(([k,l])=>`<button type="button" class="kind"
            aria-pressed="${cur.kind===k}" onclick="pickKind(this,'${k}')">${esc(l)}</button>`).join('')}
        </div></label>
      <label class="field"><span>Name the source</span>
        <input class="inp" id="nSource" value="${esc(cur.source||'')}"
               placeholder="The High Museum · my grandmother · a book title"></label>
      <label class="field"><span>What did you find?</span>
        <textarea class="inp" id="nFound" style="min-height:104px"
          placeholder="Describe it. What did it look like, who made it, what was it for?">${esc(cur.found||'')}</textarea></label>
      <label class="field"><span>What surprised you?</span>
        <textarea class="inp" id="nSurp" style="min-height:72px"
          placeholder="The thing you did not expect. This is usually the best part.">${esc(cur.surprised||'')}</textarea></label>
      <label class="field"><span>Link, if there is one</span>
        <input class="inp" id="nLink" value="${esc(cur.link||'')}" placeholder="https://…"></label>
      <p class="tiny dim" style="margin:0 0 16px;line-height:1.6">
        Your notes are seen only by your teacher. Do not include your full name, your school,
        or anything else about you.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="nSave"
          onclick="saveNote('${esc(brief||'')}','${esc(noteId||'')}')">
          ${n?'Save note':'Add note'} →</button>
        <button class="btn btn-ghost btn-sm" onclick="this.closest('.scrim').remove()">Cancel</button>
      </div>
    </div></div>`;
  document.body.appendChild(scrim);
  scrim.dataset.kind = cur.kind || 'museum';
}
function pickKind(el,k){
  el.closest('.kinds').querySelectorAll('.kind').forEach(b=>b.setAttribute('aria-pressed','false'));
  el.setAttribute('aria-pressed','true');
  document.getElementById('noteEditor').dataset.kind = k;
}

async function saveNote(briefId, noteId){
  const scrim=document.getElementById('noteEditor');
  const n={ kind: scrim.dataset.kind || 'other',
            source: $('#nSource').value.trim(), found: $('#nFound').value.trim(),
            surprised: $('#nSurp').value.trim(), link: $('#nLink').value.trim() };
  if(!n.found) return toast('Say what you found');
  const btn=$('#nSave'); btn.disabled=true; btn.textContent='Saving…';
  try{
    if(noteId) await API.updateNote(State.session.token, noteId, n);
    else       await API.addNote(State.session.token, briefId, n);
    scrim.remove();
    await loadStudent(); render();
    toast(noteId?'Note saved':'Source recorded');
  }catch(e){ btn.disabled=false; btn.textContent='Save →'; fail(e); }
}

async function dropNote(noteId){
  if(!confirm('Delete this source note?')) return;
  try{
    await API.deleteNote(State.session.token, noteId);
    await loadStudent(); render();
    toast('Note deleted');
  }catch(e){ fail(e); }
}

/* A photograph the student took themselves — the strongest evidence in
   the whole system, and the thing a chatbot cannot manufacture. */
function notePhotoPick(noteId){
  let inp=document.getElementById('notePhotoInput');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.id='notePhotoInput';
    inp.style.display='none';
    document.body.appendChild(inp);
  }
  inp.onchange = async ev => {
    const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
    if(!f) return;
    if(!/^image\//.test(f.type)) return toast('That needs to be an image');
    toast('Adding your photo…');
    try{
      const dataUrl=await fileToJpeg(f, 1200);
      await API.notePhoto(State.session.token, noteId, dataUrl);
      await loadStudent(); render();
      toast('Photo added to your note');
    }catch(e){ fail(e); }
  };
  inp.click();
}

/* Note photographs live in the private bucket, so each one needs its own
   signed URL. Fetched after paint so the page never waits on them. */
async function hydrateNoteImages(){
  if(DEMO || !State.session) return;
  const nodes=[...document.querySelectorAll('[data-note-img]')];
  for(const el of nodes){
    const url=await API.noteUrl(State.session.token, el.dataset.noteImg);
    if(url) el.innerHTML=`<img src="${esc(url)}" alt="">`;
  }
}

/* A student cannot sign a storage URL, so the edge function re-issues
   one for their own work after a reload. */
async function hydrateStudentImage(){
  if(DEMO || !State.briefOpen || !State.session) return;
  const w=myWork(State.briefOpen);
  if(!w || !w.image_path || w._url) return;
  const url=await API.readUrl(State.session.token, State.briefOpen);
  if(!url) return;
  w._url=url;
  const box=$('#dropBox');
  if(box) box.innerHTML=`<img src="${esc(url)}" alt="Your print">`;
}

function logStudio(){ const s=State.session;
  if(DEMO) Store.log(s._cid,s._mid,'open_studio'); else API.log(s.token,'open_studio'); }

function countWords(briefId){
  const b=findBrief(briefId), n=words($('#stmt').value), ok=n>=b.words;
  const el=$('#wc'); el.textContent=`${n} of ${b.words} words${ok?' ✓':''}`;
  el.style.color = ok?'var(--live)':'var(--muted)';
  const w=myWork(briefId);
  const btn=$('#subBtn');
  if(btn) btn.disabled = !(w && (w.image_path||w._url) && ok);
}

async function attachWork(ev,briefId){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  ev.target.value='';
  if(!/^image\//.test(f.type)) return toast('That needs to be an image file');
  toast('Adding your print…');
  try{
    const dataUrl=await fileToJpeg(f);
    const b=findBrief(briefId);
    const credits = b.style
      ? [(await patternsForStyle(b.style,1)).map(creditFor)[0]].filter(Boolean) : [];
    if(DEMO){
      const s=State.session;
      let w=Store.workFor(s._cid,s._mid,briefId);
      if(!w) w=Store.addWork({id:uid(),classId:s._cid,memberId:s._mid,briefId,
        image:null,statement:'',credits:[],status:'draft',featured:false,createdAt:Date.now()});
      Store.updWork(w.id,{image:dataUrl,credits});
      Store.log(s._cid,s._mid,'attach',f.name);
    } else {
      const r=await API.upload(State.session.token, briefId, dataUrl, credits);
      const w=myWork(briefId);
      if(w){ w.image_path=r.path; w._url=r.signed_url; }
      else State.works.push({brief_id:briefId,statement:'',credits,status:'draft',
                             image_path:r.path,_url:r.signed_url});
    }
    await loadStudent();
    /* keep the freshly-signed URL through the reload */
    if(!DEMO){ const w=myWork(briefId); if(w && !w._url)
      w._url = await API.readUrl(State.session.token, briefId); }
    render();
    toast('Print attached');
  }catch(e){ fail(e); }
}

async function saveDraft(briefId){
  const stmt=$('#stmt').value;
  try{
    if(DEMO){
      const s=State.session;
      let w=Store.workFor(s._cid,s._mid,briefId);
      if(!w) w=Store.addWork({id:uid(),classId:s._cid,memberId:s._mid,briefId,
        image:null,statement:'',credits:[],status:'draft',featured:false,createdAt:Date.now()});
      Store.updWork(w.id,{statement:stmt});
      Store.log(s._cid,s._mid,'save_draft',words(stmt)+' words');
    } else {
      await API.saveWork(State.session.token, briefId, stmt, null);
      API.log(State.session.token,'save_draft',words(stmt)+' words');
    }
    const w=myWork(briefId); if(w) w.statement=stmt;
    toast('Draft saved');
  }catch(e){ fail(e); }
}

async function submitWork(briefId){
  const b=findBrief(briefId), stmt=$('#stmt').value;
  const w=myWork(briefId);
  if(!w || !(w.image_path||w._url)) return toast('Attach your print first');
  if(words(stmt)<b.words) return toast(`The statement needs at least ${b.words} words`);
  const again=w.status==='submitted';
  try{
    if(DEMO){
      const s=State.session;
      const dw=Store.workFor(s._cid,s._mid,briefId);
      Store.updWork(dw.id,{statement:stmt,status:'submitted',submittedAt:Date.now()});
      Store.log(s._cid,s._mid, again?'resubmit':'submit', b.title);
    } else {
      await API.saveWork(State.session.token, briefId, stmt, null);
      await API.submit(State.session.token, briefId);   /* the floor is enforced here */
    }
    await loadStudent(); render();
    toast(again?'Turned in again':'Turned in — your teacher can see it now');
  }catch(e){
    const m=String(e.message||e);
    if(/source note/i.test(m))    toast(m);
    else if(/needs \d+ words/.test(m)) toast(m);
    else if(/attach/i.test(m))    toast('Attach your print first');
    else fail(e);
  }
}

/* ══════════════════════════════════════════════════════════════
   DEMO SEED — ?demo=1 only
   A showroom gallery must never be empty.
   ══════════════════════════════════════════════════════════════ */
function seedDemo(){
  Store.reset();
  const teacher='demo@school.edu';
  const c=Store.addClass({ id:uid(), code:'ADINKR', name:'Period 3 · Visual Arts',
    teacher, assigned:['adinkra','shibori'], createdAt:Date.now()-864e5*9 });
  const H=36e5, D=864e5, now=Date.now();
  const people=[
    { name:'Maya R.', brief:'adinkra', st:'submitted', at:now-D*2,
      s:"I chose Sankofa, the bird that looks backward while walking forward. It means you can go back and get what you forgot — my grandmother says something close to that in Creole, so it already felt like ours. Adinkra symbols were stamped with carved calabash and dye made from tree bark, and the cloth was worn at funerals, which surprised me because I assumed pattern always meant celebration.\n\nMy own symbol is a key inside an open hand. It stands for my mother giving me the house key the first week she trusted me alone. I borrowed the grid — Adinkra repeats in bands with a stamped edge, so mine does too, and I kept the block spacing loose the way a hand-stamp never lands perfectly. What I changed is the colour: traditional Adinkra is often dark brown-black on russet, and I used the indigo family because the key was cold when she handed it to me. I also let my symbol break the grid once, in the bottom corner, so the eye finds it." },
    { name:'Devon A.', brief:'adinkra', st:'submitted', at:now-D-H*4,
      s:"Gye Nyame is everywhere in Ghana — on buildings, on cloth, on the back of taxis. It means except for God, and it is probably the most used Adinkra symbol there is. What surprised me is that the symbols were a whole writing system before they were decoration, and that a chief could wear a cloth that argued with you without saying anything.\n\nI made a symbol for stubbornness, which my coach calls my best and worst quality. It is two arrows pushing into each other and neither one bending. I borrowed the way Adinkra fills a square completely so the stamp reads at a distance, and the way the same block repeats until the repetition becomes the message. I changed the scale — I made mine much larger than a real stamp so it reads as a poster instead of cloth, and I used only two colours because I wanted it to feel like a warning sign more than a fabric." },
    { name:'Priya S.', brief:'shibori', st:'draft', at:now-H*6,
      s:"I picked itajime, the one where you fold the cloth and clamp it between two shapes so the dye can't reach the middle. " }
  ];
  people.forEach((p,i)=>{
    const m=Store.addMember({ id:uid(), classId:c.id, name:p.name, device:'demo'+i,
      joinedAt:now-D*8+i*H });
    ['join','open_brief','view_tradition'].forEach(k=>Store.log(c.id,m.id,k,
      k==='join'?'':briefById(p.brief).title));
    Store.log(c.id,m.id,'open_studio');
    if(p.st==='submitted'){
      Store.log(c.id,m.id,'attach','print_final.png');
      Store.log(c.id,m.id,'save_draft','82 words');
      Store.log(c.id,m.id,'submit',briefById(p.brief).title);
    } else Store.log(c.id,m.id,'save_draft','24 words');
    const evs=Store.events(c.id,m.id);
    evs.forEach((e,k)=>{ e.at = p.at - (evs.length-k)*H*(1.5+i); });
    Store._save();
    Store.addWork({ id:uid(), classId:c.id, memberId:m.id, briefId:p.brief,
      image:demoPrint(p.brief,i), statement:p.s, credits:[demoCredit(p.brief)],
      status:p.st, featured:i===0,
      createdAt:p.at-D, submittedAt:p.st==='submitted'?p.at:null });
  });
  return teacher;
}
const demoCredit = b => b==='adinkra'
  ? 'Akan people, Ghana & Côte d’Ivoire · Africa' : 'Japan · Asia';

function demoPrint(brief,i){
  const c=document.createElement('canvas'); c.width=c.height=520;
  const x=c.getContext('2d');
  const sets=[['#1b2f4b','#e8dcc4','#c9a96e','#7c2f2f'],
              ['#2d3f2a','#f0e6d2','#a9803c','#5c4033'],
              ['#12324d','#eef2f4','#5b8ca8','#0d1f2d']];
  const P=sets[i%3];
  x.fillStyle=P[1]; x.fillRect(0,0,520,520);
  if(brief==='adinkra'){
    for(let r=0;r<4;r++) for(let k=0;k<4;k++){
      const px=18+k*126, py=18+r*126;
      x.fillStyle=(r+k)%2?P[0]:P[3]; x.fillRect(px,py,110,110);
      x.strokeStyle=P[2]; x.lineWidth=5; x.beginPath();
      x.arc(px+55,py+55,30,0,Math.PI*2); x.stroke();
      x.beginPath(); x.moveTo(px+55,py+18); x.lineTo(px+55,py+92);
      x.moveTo(px+18,py+55); x.lineTo(px+92,py+55); x.stroke();
    }
  } else {
    x.fillStyle=P[0]; x.fillRect(0,0,520,520);
    for(let b=0;b<9;b++){
      x.fillStyle=b%2?P[1]:P[2]; x.globalAlpha=.85;
      for(let q=0;q<7;q++){
        const w=30+((b*7+q*13)%46);
        x.beginPath(); x.ellipse(26+q*76, 30+b*58, w/2, 15, 0, 0, Math.PI*2); x.fill();
      }
    }
    x.globalAlpha=1;
  }
  x.fillStyle='rgba(0,0,0,.42)'; x.fillRect(0,486,520,34);
  x.fillStyle='#fff'; x.font='500 14px DM Sans, sans-serif'; x.textAlign='center';
  x.fillText(demoCredit(brief)+'  ·  CoCo by CultureSchool', 260, 508);
  return c.toDataURL('image/jpeg',0.8);
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  render();   /* paint the gate immediately; auth resolves underneath */

  if(DEMO){
    if(!Store.classes().length) State.teacher = seedDemo();
    else State.teacher = 'demo@school.edu';
    try{
      const s=JSON.parse(sessionStorage.getItem('cs_school_sess')||'null');
      if(s && s.token && String(s.token).startsWith('demo:') && Store.classById(s._cid)){
        State.session=s; await loadStudent(); return go('student');
      }
    }catch(_){}
    await loadTeacher(); return go('teacher');
  }

  /* A student session survives a reload; the token is the only thing kept. */
  try{
    const s=JSON.parse(sessionStorage.getItem('cs_school_sess')||'null');
    if(s && s.token && !String(s.token).startsWith('demo:')){
      State.session=s; await loadStudent();
      if(State.session) return go('student');
    }
  }catch(_){}

  /* Magic-link return lands here with a session already exchanged. */
  sb.auth.onAuthStateChange(async (evt, session) => {
    const email = session?.user?.email || null;
    if(email && email !== State.teacher){
      State.teacher = email;
      if(history.replaceState) history.replaceState({}, '', location.pathname);
      await loadTeacher();
      go('teacher');
    } else if(!email && State.teacher){
      State.teacher=null; render();
    }
  });

  const { data:{ session } } = await sb.auth.getSession();
  if(session?.user?.email){
    State.teacher = session.user.email;
    await loadTeacher();
    go('teacher');
  }
}
boot();
